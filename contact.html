<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="bar" class="bar"></header>
<main id="main">
<div class="talk">
<section class="talk-hero" data-batik>
  <div class="wrap">
    <h1>Let's talk.</h1>
    <p>Questions, partnerships, or just saying hi. We'd love to hear from you.</p>
    <button class="talk-email" id="talk-email" type="button"><span id="talk-address"></span></button>
    <p class="talk-hint" id="talk-hint" role="status">Click to copy</p>
  </div>
</section>
<section class="wrap talk-write">
  <div class="talk-ask reveal">
    <h2>What brings you here?</h2>
    <div class="talk-chips" id="talk-chips"></div>
  </div>
  <form class="letter reveal" id="letter">
    <p class="letter-line"><span>To</span><b id="letter-to"></b></p>
    <p class="letter-line"><span>Subject</span><b id="letter-subject"></b></p>
    <label class="letter-msg"><span class="sr">Your message</span><textarea id="letter-body" rows="6"></textarea></label>
    <label class="letter-name">From<input id="letter-name" autocomplete="name" placeholder="Your name"></label>
    <div class="letter-foot">
      <button class="btn blue" type="submit">Open in my email</button>
      <small>You can check it before it sends.</small>
    </div>
  </form>
</section>
<section class="talk-social">
  <div class="wrap">
    <h2 class="reveal">Find us online</h2>
    <div class="social-rows" id="social-grid"></div>
  </div>
  <img class="social-float" id="social-float" alt="" aria-hidden="true">
</section>
</div>
</main>
<footer id="site-foot"></footer>
<script src="js/content.js?v=20261106c"></script>
