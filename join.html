<body data-page="join">
<a class="skip" href="#main">Skip to content</a>
<header id="bar" class="bar"></header>
<main id="main">
<section class="page-head" data-batik><div class="wrap"><h1>Join PERMIAS</h1><p>Meet the community, hear about events, and get involved.</p></div></section>
<section class="wrap sec join-grid">
  <div class="reveal">
    <h2>Say hello</h2>
    <p class="note join-copy">Tell us a little about yourself, and we'll get you connected. Sending this opens an email to the PERMIAS team, so you can check it before it goes.</p>
  </div>
  <div id="join-box" class="reveal">
    <form id="join-form" class="join-form">
      <label>Full name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>I am a
        <select name="status" required>
          <option value="">Choose one</option>
          <option>New U-M student</option>
          <option>Current U-M student</option>
          <option>Alum</option>
          <option>Family member or community member</option>
          <option>Friend of Indonesia</option>
        </select>
      </label>
      <label>U-M school or program (optional)<input name="program"></label>
      <fieldset>
        <legend>I'm interested in</legend>
        <label class="check"><input type="checkbox" name="interest" value="Events"> Events</label>
        <label class="check"><input type="checkbox" name="interest" value="Sports and activities"> Sports and activities</label>
        <label class="check"><input type="checkbox" name="interest" value="Career and professional development"> Career and professional development</label>
        <label class="check"><input type="checkbox" name="interest" value="Volunteering"> Volunteering</label>
        <label class="check"><input type="checkbox" name="interest" value="WhatsApp group"> Joining the WhatsApp group</label>
      </fieldset>
      <button class="btn blue" type="submit">Create email to PERMIAS</button>
    </form>
  </div>
</section>
</main>
<footer id="site-foot"></footer>
